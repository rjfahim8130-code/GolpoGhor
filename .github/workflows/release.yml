name: Build Flutter Release (APK & AAB)

on:
  push:
    branches:
      - main # Or your default branch name (e.g., master)
  # You can also trigger the build manually from the Actions tab
  workflow_dispatch:

jobs:
  build_release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Or 'master'/'beta', stable is recommended
          cache: true       # Caches Flutter SDK to speed up subsequent builds

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Release)
        # Command: flutter build apk --release
        run: flutter build apk --release

      - name: Build App Bundle (AAB - Release)
        # Command: flutter build appbundle --release
        # AAB is required for uploading to the Google Play Store
        run: flutter build appbundle --release

      # --- Optional: Upload build files as Artifacts to GitHub ---
      # This allows you to download the files from the Actions tab after the build is complete.

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          # Default path
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error # Fails the step if the file is not found

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          # Default path
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error # Fails the step if the file is not found
