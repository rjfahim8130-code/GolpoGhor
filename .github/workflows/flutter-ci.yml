name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform if missing
        run: |
          echo "Checking android folder..."
          ls -la
          if [ ! -d android ]; then
            echo "android/ missing — running flutter create"
            flutter create . --project-name golpoghor --org com.golpoghor --platforms=android
          elif [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "android/ incomplete — running flutter create"
            flutter create . --project-name golpoghor --org com.golpoghor --platforms=android
          else
            echo "android/ OK"
          fi
          ls -la android/app/ || true

      - name: Update Kotlin Version in Gradle
        run: |
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle
          elif [ -f android/build.gradle.kts ]; then
            sed -i 's/val kotlinVersion = .*/val kotlinVersion = "1.9.24"/' android/build.gradle.kts
          fi

      - name: Update Gradle Wrapper and Disable Lint
        run: |
          cd android
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-all.zip|' gradle/wrapper/gradle-wrapper.properties

          if [ -f app/build.gradle ]; then
            echo -e "\nandroid {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}" >> app/build.gradle
          elif [ -f app/build.gradle.kts ]; then
            echo -e "\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}" >> app/build.gradle.kts
          fi
          cd ..

      - name: Ensure INTERNET permission in AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
              sed -i 's|<manifest\(.*\)>|<manifest\1>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>|' "$MANIFEST"
            fi
            sed -i 's/android:label="[^"]*"/android:label="Golpoghor"/' "$MANIFEST"
          else
            echo "Manifest NOT found!"
            exit 1
          fi

      - name: Enable Core Library Desugaring
        run: |
          if [ -f android/app/build.gradle ]; then
            echo "Enabling desugaring in Groovy DSL..."
            awk '{print} /compileOptions \{/ && !done {print "        coreLibraryDesugaringEnabled true"; done=1}' android/app/build.gradle > android/app/build.gradle.tmp && mv android/app/build.gradle.tmp android/app/build.gradle

            sed -i 's/^dependencies {$/dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"/' android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            echo "Enabling desugaring in Kotlin DSL..."
            awk '{print} /compileOptions \{/ && !done {print "        isCoreLibraryDesugaringEnabled = true"; done=1}' android/app/build.gradle.kts > android/app/build.gradle.kts.tmp && mv android/app/build.gradle.kts.tmp android/app/build.gradle.kts

            sed -i 's/^dependencies {$/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")/' android/app/build.gradle.kts
          fi

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Analyze (fail on error)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (fail on error)
        run: flutter test

      - name: Build release APK (obfuscated)
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }} \
            --dart-define=R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }} \
            --dart-define=R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }} \
            --dart-define=R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: golpoghor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
