name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }} \
            --dart-define=R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: golpoghor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          
